# XRT runtime configuration. PACKAGED ONTO THE SD CARD next to mosse_tracker.elf
# (Makefile: XRT_INI), so XRT reads it from the working directory at startup.
#
# WHY THAT MATTERS: nothing in the boot image depends on this file's contents, so
# every setting here can be changed by mounting the card and editing it — no
# rebuild, no repackage, no re-synthesis. That makes it the right place to A/B the
# scheduler/driver hypotheses behind roi_crop's 505 ms crop_run.wait().
#
# TWO TRAPS, both of which make a variant look like "no effect":
#
#  1. AN UNRECOGNISED KEY IS SILENTLY IGNORED. XRT does not warn about typos or
#     about keys that do not exist in this version. Before concluding a setting
#     did nothing, confirm the key exists in THIS build, on the board:
#         strings /usr/lib/libxrt_core.so* | grep -i <key>
#     Guessing key names from documentation for another XRT release is how an
#     afternoon of A/B runs produces four identical numbers.
#
#  2. THE FILE MUST SIT IN THE PROCESS'S WORKING DIRECTORY. run_script.sh cd's
#     nowhere, so that is the FAT partition root. A copy left in a subdirectory
#     is inert.

#[Emulation]
#launch_waveform=gui

# TRACING IS OFF DELIBERATELY — DO NOT ENABLE IT FOR A TIMING RUN.
#
# This block was the file's only content while the file was not being packaged,
# i.e. it was never active on the board. Now that the file IS packaged, enabling
# it would instrument the very path being measured: xrt_trace logs every command
# submission and completion, which is exactly where the 505 ms lives, and the
# trace buffer is flushed to the SD card. Turn it on only to inspect command
# ordering, never to measure command latency, and never in the same run as the
# RC_*/timeline instrumentation in mosse_tracker.cpp.
#[Debug]
#xrt_trace=true
#device_trace=fine
#trace_buffer_size=50M
