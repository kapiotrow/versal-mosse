# plio_smoke.cfg — v++ linker config for the minimal PLIO smoke test.
#
# stream_src (PL) --AXIS--> ai_engine_0.SmokeIn (PLIO, 32-bit)
#
# No sp= entries: stream_src has no m_axi port, only an AXIS output and the
# s_axilite control interface. The only thing under test is the PL->AIE stream.

[connectivity]
nk=stream_src:1:stream_src_0

stream_connect=stream_src_0.out:ai_engine_0.SmokeIn

[advanced]
param=hw_emu.enableProfiling=false
param=compiler.userPostSysLinkOverlayTcl=/home/karolina/studia/MGR/versal-mosse/design/directives/post_sys_link.tcl
